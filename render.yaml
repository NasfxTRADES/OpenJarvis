# Render Blueprint for the OpenJarvis phone app.
# Builds deploy/docker/Dockerfile and runs the same `jarvis mobile` server you
# would run on your own machine, so the iPhone app is reachable over HTTPS
# without keeping a computer awake.
# Apply at: https://dashboard.render.com/blueprint/new
services:
  - type: web
    name: openjarvis-mobile
    runtime: docker
    plan: free
    region: oregon
    branch: freebuff/507284ad46251e28e0f313d0
    dockerfilePath: ./deploy/docker/Dockerfile
    dockerContext: .
    # `jarvis mobile` picks the provider from whichever key is present
    # (Gemini first, then OpenRouter, then Ollama) and serves the phone app at
    # /m. Render does not interpolate $PORT inside dockerCommand, so the port is
    # pinned here and in PORT below; change both together.
    #
    # Render's Docker Command replaces the image's ENTRYPOINT as well as its
    # CMD: it runs the string as the container's whole process, so it has to
    # name the `jarvis` binary. A bare `mobile --port 10000` sends Render looking
    # for a program called `mobile`, which does not exist, and the deploy fails
    # with the uninformative "Exited with status 128" and no application output.
    dockerCommand: /usr/local/bin/jarvis mobile --host 0.0.0.0 --port 10000
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"

      # The key the phone must present. Copy it from the dashboard after the
      # first deploy and paste it into the app once; the phone remembers it.
      - key: OPENJARVIS_API_KEY
        generateValue: true

      # No provider key is required to deploy: the app starts, serves /m and
      # asks you to connect a model. Fill in as many of these as you like in
      # the service's Environment tab; the service redeploys itself when you
      # save one. Jarvis then chains them in free-first order and switches to
      # the next one automatically whenever a provider runs out of allowance
      # (HTTP 429 / quota): Groq → Cerebras → Gemini → Mistral → OpenRouter
      # free → Grok → ChatGPT → Claude. Reorder or restrict the chain with
      # OPENJARVIS_FREE_CHAIN="groq,gemini,openrouter" below.
      #
      # Free, no card required:
      #   GROQ_API_KEY        console.groq.com/keys
      #   CEREBRAS_API_KEY    cloud.cerebras.ai
      #   GEMINI_API_KEY      aistudio.google.com/apikey
      #   MISTRAL_API_KEY     console.mistral.ai/api-keys
      #   OPENROUTER_API_KEY  openrouter.ai/keys (zero-priced models)
      #   XAI_API_KEY         console.x.ai (Grok; free credits on signup)
      # Paid per token — only used once every free provider is spent:
      #   OPENAI_API_KEY      platform.openai.com/api-keys (ChatGPT)
      #   ANTHROPIC_API_KEY   console.anthropic.com (Claude)
      - key: GROQ_API_KEY
        value: ""
      - key: CEREBRAS_API_KEY
        value: ""
      - key: GEMINI_API_KEY
        value: ""
      - key: MISTRAL_API_KEY
        value: ""
      - key: OPENROUTER_API_KEY
        value: ""
      - key: XAI_API_KEY
        value: ""
      - key: OPENAI_API_KEY
        value: ""
      - key: ANTHROPIC_API_KEY
        value: ""
      - key: OPENJARVIS_FREE_CHAIN
        value: "groq,cerebras,gemini,mistral,openrouter,grok,openai,claude"

      # The free instance filesystem is ephemeral: scheduled tasks, the saved
      # model choice and transcripts are lost on every restart, spin-down or
      # deploy. Keys above survive because they are environment variables.
      - key: OPENJARVIS_HOME
        value: /home/openjarvis/.openjarvis
